services:
  web:
    image: ghcr.io/jtarang/boostlog-app:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.dev
    restart: unless-stopped

  # Postgres now runs on the shared RDS instance (DATABASE_URL points at it).
  # The in-VM `db` container and its postgres_data volume have been retired —
  # see terraform/RDS.md.

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: boostlog-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
